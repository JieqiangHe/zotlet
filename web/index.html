<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><meta name="zotlet-token" content="__ZOTLET_TOKEN__">
  <title>zotlet</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">zotlet</div>
    <button id="add-reference" class="primary">New</button>
    <input id="reference-search" class="search-input" type="search" placeholder="Search" aria-label="Search">
    <select id="cite-style" aria-label="Style">
      <option value="nature">Nature</option>
      <option value="science">Science</option>
      <option value="cell">Cell</option>
    </select>
    <button id="gen-bib">Bib</button>
    <div class="export-group">
      <button id="export-btn">Export</button>
      <div id="export-menu" class="menu hidden">
        <button data-format="json">CSL JSON</button>
        <button data-format="bibtex">BibTeX</button>
        <button data-format="ris">RIS</button>
      </div>
    </div>
    <span class="spacer"></span>
    <button id="theme-toggle" title="Toggle dark mode">◐</button>
    <button id="citation-status" class="service-button"><span class="dot"></span><span id="citation-state">Off</span></button>
  </header>
  <div class="main-layout">
    <aside class="collections-pane">
      <div class="pane-header">Projects</div>
      <div id="collections-list" class="collections-list">
        <button class="collection-item active" data-id="">All</button>
      </div>
      <div class="pane-footer">
        <button id="new-project" class="small" title="New project">＋ New</button>
        <button id="rename-project" class="small" title="Rename selected project">Rename</button>
        <button id="delete-project" class="small danger" title="Delete selected project">Delete</button>
      </div>
    </aside>
    <section class="items-pane">
      <div class="pane-header"><span id="visible-count" class="muted"></span></div>
      <div id="reference-list" class="reference-list"></div>
    </section>
  </div>
  <footer class="statusbar"><span id="data-location"></span><span>v0.5</span><span id="connection">Connecting…</span></footer>

  <dialog id="reference-dialog" class="reference-dialog" aria-labelledby="reference-dialog-title"><header class="dialog-heading"><h2 id="reference-dialog-title">Add reference</h2><button id="close-reference" class="icon-button" aria-label="Close">×</button></header>
    <nav id="reference-modes" class="dialog-tabs"><button id="identifier-mode" class="active">DOI / PMID</button><button id="manual-mode">Manual</button></nav>
    <section id="identifier-form"><label class="field">Identifiers<textarea id="reference-identifiers" rows="3" placeholder="10.1038/... or PMID:123"></textarea></label><button id="lookup-reference" class="primary">Look up</button><div id="reference-import-results"></div><p id="import-reference-error" class="notice hidden" role="alert"></p></section>
    <form id="metadata-form" class="hidden"><p id="reference-stable-key" class="path"></p><label class="field">Title<textarea id="ref-title" rows="2" required></textarea></label><label class="field">Authors <span class="muted">Family, Given · one per line</span><textarea id="ref-author" rows="3"></textarea></label><div class="field-grid"><label class="field">Type<select id="ref-type"><option value="article-journal">Journal article</option><option value="book">Book</option><option value="chapter">Book chapter</option><option value="report">Report</option><option value="thesis">Thesis</option><option value="webpage">Web page</option><option value="dataset">Dataset</option></select></label><label class="field">Year<input id="ref-year" type="number" min="1" max="9999"></label></div><label class="field">Journal / book title<input id="ref-container"></label><div class="field-grid three"><label class="field">Volume<input id="ref-volume"></label><label class="field">Issue<input id="ref-issue"></label><label class="field">Pages<input id="ref-page"></label></div><label class="field">DOI<input id="ref-doi" spellcheck="false"></label><details><summary>More fields</summary><label class="field">Publisher<input id="ref-publisher"></label><label class="field">URL<input id="ref-url" type="url"></label><label class="field">Abstract<textarea id="ref-abstract" rows="4"></textarea></label></details><p id="reference-edit-error" class="notice hidden" role="alert"></p><div class="dialog-actions"><span class="muted">Citation keys stay unchanged.</span><button id="save-reference" type="submit" class="primary">Save</button></div></form>
  </dialog>
  <dialog id="citation-dialog"><header class="dialog-heading"><h2>Citation service</h2><button id="close-citations" class="icon-button" aria-label="Close">×</button></header><p id="citation-description" class="muted"></p><pre id="citation-logs"></pre><div class="dialog-actions"><button id="start-citations" class="primary">Start service</button></div></dialog>
  <dialog id="project-dialog"><form id="project-form"><header class="dialog-heading"><h2>New Project</h2><button id="close-project" type="button" class="icon-button" aria-label="Close">×</button></header><label class="field">Name<input id="project-name" required placeholder="My paper…"></label><p id="project-error" class="notice hidden" role="alert"></p><div class="dialog-actions"><button type="submit" class="primary">Create</button></div></form></dialog>
  <dialog id="bib-dialog"><header class="dialog-heading"><h2>Bib</h2><button id="close-bib" class="icon-button" aria-label="Close">×</button></header><pre id="bib-text"></pre><div class="dialog-actions"><button id="copy-bib">Copy</button><button id="download-bib" class="primary">Download .txt</button></div></dialog>
  <div id="toast" role="status" class="toast hidden"></div>
</body>
</html>
