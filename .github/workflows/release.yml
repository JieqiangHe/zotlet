# Build dist/zotlet-<version>.zip with scripts/package.sh and publish it as the
# GitHub release v<version> (version from package.json). Runs when a tag v* is
# pushed, or by hand (Actions → release → Run workflow), which creates the tag.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "v$VERSION" = "$GITHUB_REF_NAME"; fi
      - run: npm test
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "dist/zotlet-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "zotlet $VERSION" --generate-notes
